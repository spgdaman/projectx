apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bargainhunters-ingress
  namespace: bargainhunters
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - bargainhunters.co.ke
        - www.bargainhunters.co.ke
      secretName: bargainhunters-tls
  rules:
    # ── Apex domain → Next.js ─────────────────────────────────────────────────
    - host: bargainhunters.co.ke
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-service
                port:
                  number: 3000
    # ── www subdomain — API routes → Django, everything else → Next.js ────────
    - host: www.bargainhunters.co.ke
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: django-service
                port:
                  number: 8000
          - path: /django-admin
            pathType: Prefix
            backend:
              service:
                name: django-service
                port:
                  number: 8000
          - path: /static
            pathType: Prefix
            backend:
              service:
                name: django-service
                port:
                  number: 8000
          - path: /media
            pathType: Prefix
            backend:
              service:
                name: django-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-service
                port:
                  number: 3000
