apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: static-pvc
  namespace: bargainhunters
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: django
  namespace: bargainhunters
spec:
  replicas: 2
  selector:
    matchLabels:
      app: django
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: django
    spec:
      initContainers:
        # Run migrations and collectstatic before pods go live
        - name: migrate
          image: localhost:5000/bargainhunters-django:latest
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - configMapRef:
                name: bargainhunters-config
            - secretRef:
                name: bargainhunters-secret
        - name: collectstatic
          image: localhost:5000/bargainhunters-django:latest
          command: ["python", "manage.py", "collectstatic", "--noinput"]
          envFrom:
            - configMapRef:
                name: bargainhunters-config
            - secretRef:
                name: bargainhunters-secret
          volumeMounts:
            - name: static-files
              mountPath: /app/staticfiles
      containers:
        - name: django
          image: localhost:5000/bargainhunters-django:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: bargainhunters-config
            - secretRef:
                name: bargainhunters-secret
          volumeMounts:
            - name: static-files
              mountPath: /app/staticfiles
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: static-files
          persistentVolumeClaim:
            claimName: static-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: django-service
  namespace: bargainhunters
spec:
  selector:
    app: django
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: django-hpa
  namespace: bargainhunters
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: django
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
