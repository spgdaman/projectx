# ── Celery default queue ──────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-default
  namespace: bargainhunters
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-default
  template:
    metadata:
      labels:
        app: celery-default
    spec:
      containers:
        - name: celery-default
          image: localhost:5000/bargainhunters-celery:latest
          command: ["celery", "-A", "catalogue", "worker", "-Q", "default", "-c", "2", "-l", "info"]
          envFrom:
            - configMapRef:
                name: bargainhunters-config
            - secretRef:
                name: bargainhunters-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
# ── Celery Naivas queue ───────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-naivas
  namespace: bargainhunters
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-naivas
  template:
    metadata:
      labels:
        app: celery-naivas
    spec:
      containers:
        - name: celery-naivas
          image: localhost:5000/bargainhunters-celery:latest
          # concurrency 1: Naivas falls back to Playwright which is memory-heavy;
          # single worker avoids two Playwright instances competing for RAM.
          command: ["celery", "-A", "catalogue", "worker", "-Q", "naivas-queue", "-c", "1", "-l", "info"]
          envFrom:
            - configMapRef:
                name: bargainhunters-config
            - secretRef:
                name: bargainhunters-secret
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
---
