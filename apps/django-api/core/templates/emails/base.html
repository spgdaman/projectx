<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block subject %}Bargain Hunters{% endblock %}</title>
  <style>
    body { margin: 0; padding: 0; background-color: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .wrapper { max-width: 600px; margin: 32px auto; background: #ffffff; border-radius: 12px; overflow: hidden; border: 1px solid #E5E7EB; }
    .header { background-color: #E54416; padding: 28px 32px; text-align: center; }
    .header-logo { display: inline-block; width: 48px; height: 48px; background: rgba(255,255,255,0.2); border-radius: 12px; line-height: 48px; font-size: 22px; font-weight: 800; color: #ffffff; text-align: center; margin-bottom: 10px; }
    .header h1 { margin: 0; font-size: 22px; font-weight: 800; color: #ffffff; letter-spacing: -0.3px; }
    .header p { margin: 4px 0 0; font-size: 13px; color: rgba(255,255,255,0.8); }
    .body { padding: 32px; color: #111827; }
    .body p { font-size: 15px; line-height: 1.6; color: #374151; margin: 0 0 16px; }
    .body h2 { font-size: 18px; font-weight: 700; color: #111827; margin: 0 0 12px; }
    .btn { display: inline-block; background-color: #E54416; color: #ffffff !important; font-size: 15px; font-weight: 700; padding: 14px 28px; border-radius: 10px; text-decoration: none; margin: 8px 0 20px; }
    .btn:hover { background-color: #C73D0F; }
    .card { background: #FFF9F1; border: 1px solid #FDEBD0; border-radius: 10px; padding: 20px 24px; margin: 20px 0; }
    .card p { margin: 0 0 8px; }
    .card p:last-child { margin: 0; }
    .label { font-size: 12px; font-weight: 600; color: #9CA3AF; text-transform: uppercase; letter-spacing: 0.5px; }
    .value { font-size: 16px; font-weight: 700; color: #111827; }
    .divider { border: none; border-top: 1px solid #E5E7EB; margin: 24px 0; }
    .footer { background: #F9FAFB; padding: 20px 32px; text-align: center; border-top: 1px solid #E5E7EB; }
    .footer p { font-size: 12px; color: #9CA3AF; margin: 0 0 6px; }
    .footer a { color: #E54416; text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <div class="header-logo">BH</div>
      <h1>Bargain Hunters</h1>
      <p>Kenya's best deals, delivered to you</p>
    </div>
    <div class="body">
      {% block content %}{% endblock %}
    </div>
    <div class="footer">
      <p>You're receiving this email because you have an account at <a href="{{ site_url }}">bargainhunters.co.ke</a>.</p>
      <p>© 2026 Bargain Hunters. All rights reserved.</p>
    </div>
  </div>
</body>
</html>
